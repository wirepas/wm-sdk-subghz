; Custom Memory areas that can be defined
;
; On this platform you can use up to 208 kB of internal memory starting at
; address 0x8044000. External memory is required for storing the scratchpad
; (scratchpad_area). It can also be used for application data storage
; (ext_memory).
;
; There is room for 8 areas. Wirepas uses 3 of them so 5 other ones can be
; defined.
;
; By default, two areas are defined. One to store application and a smaller one
; to store persistent application data.
;
; To override this file, please copy this file under your application folder and
; override the INI_FILE_APP variable (from the application config.mk).
;
; If your application is supported by multiple platforms, do not forget to have
; a dedicated file for each of them.
;
; Flags definition:
; bit 0 : store version numbers in this area (must be 1 for application area and 0 for others
; except if you know what you are doing)
; bit 1 : memory area is located in external flash
; bits 2,3,4 : area type, 0:bootloader, 1:stack, 2:application, 3:persistent, 4:scratchpad, 5:user, 6:modemfw

[scratchpad]
area = "scratchpad_area" ; Area where scratchpad will be stored

[area:application]
id      = APP_AREA_ID   ; Area ID, different for each application
address = 0x08044000    ; Start address: right after firmware
length  = 212992        ; Length in bytes: 208 kB, dedicated for app, scratchpad in ext.flash
flags   = 0x00000009    ; Store version; internal flash; application

[area:app_persistent]
id      = 0x8AE573BA    ; Area ID, same for all apps/platform by default
address = 0x08078000    ; Start address: end of app_area - 16 kB
length  = 16384         ; Length in bytes: 16 kB
flags   = 0x00000014    ; internal flash, user

[area:ext_memory]
id      = 0x8AE573BB    ; Area ID, same for all apps/platform by default
address = 0x00080000    ; Start address: after scratchpad (512KB)
length  = 65536         ; Length in bytes: Multiple of 32 KB - i.e. minimum MX25R erase sector size
flags   = 0x00000016    ; external flash, user

[area:scratchpad_area]
id      = 0x30000010  ; Area ID: HWM_EFR32XG23 (16) | 0x30000000
address = 0x00000000  ; Area start address
length  = 360448      ; Length in bytes : 352 kB (11 * 32 KB)
flags   = 0x00000012  ; External flash, Scratchpad area
